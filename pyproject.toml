[project]
name = "cc-bedrock"
version = "0.1.0"
description = "Claude Code on Amazon Bedrock for an organisation: Identity Center sign-in, usage dashboard, budgets"
requires-python = ">=3.12"
dependencies = ["aws-cdk-lib>=2.200", "constructs>=10", "pyyaml>=6", "boto3>=1.40"]

[tool.ruff]
line-length = 120
extend-exclude = ["cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"client/*" = ["UP017"]  # client/ runs on macOS's own Python 3.9, which has no datetime.UTC
